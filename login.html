<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veterinaria</title>
    <link rel="icon" href="img/icon/favicon_II.ico" />
    <!-- GoogleFonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300&family=Raleway:wght@200;300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style/default.css" />
    <link rel="stylesheet" href="./style/login.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>

  <body>
    <main>
      <div style="position:relative; padding:10px 0 0 10px;">
        <label for="langSelector" style="margin-right:6px; font-size:14px">ES/EN</label>
        <select id="langSelector" aria-label="Seleccionar idioma">
          <option value="es">&#x1F1EA;&#x1F1F8; ES</option>
          <option value="en">&#x1F1EC;&#x1F1E7; EN</option>
        </select>
      </div>
      <form action="/login.php" method="POST">
        <fieldset class="LoginFieldset">
          <legend><h2 data-i18n="login_title">Login</h2></legend>
          <label for="EMAIL" data-i18n="login_email">EMAIL</label>
          <input
            type="text"
            id="EMAIL"
            name="EMAIL"
            autocomplete="email"
            required
          />
          <br />
          <br />
          <label for="PASSWORD" data-i18n="login_password">PASSWORD</label>
          <input
            type="password"
            id="PASSWORD"
            name="PASSWORD"
            autocomplete="current-password"
            required
          />
          <br />
          <br />
          <div>
            <p data-i18n="label_mensaje">MENSAJE:</p>
            <div id="txtmsg"></div>
          </div>
          <br />
          <br />
          <div class="login_modal-footer">
            <button id="btnLogin" type="button" class="login_btn" data-i18n="save">Guardar</button>
          </div>
        </fieldset>
      </form>
    </main>

    <!-- Incluyendo funciones -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./js/toasts.js"></script>
    <script src="./js/i18n.js"></script>
    <script src="./js/login.js"></script>
  </body>
</html>
