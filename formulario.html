    <main>
      <!-- Formulario solicitud de turno  -->
      <form action="/formulario.php" method="POST">
        <fieldset class="FormularioFieldset">
          <legend><h2 data-i18n="form_turnos_title">Turnos</h2></legend>
          <label for="nombreDueño" data-i18n="form_nombre_dueno">Nombre y Apellido:</label>
          <input type="text" id="nombreDueño" name="nombreDueño" required />
          <br />
          <br />

          <label for="nombreMascota" data-i18n="form_nombre_mascota">Nombre de la mascota:</label>
          <input type="text" id="nombreMascota" name="nombreMascota" required />
          <br />
          <br />
          <label for="mascotaTipo" data-i18n="form_tipo_mascota">Tipo de mascota:</label>
          <select name="mascotaTipo" id="mascotaTipo">
            <option>Gato</option>
            <option>Perro</option>
            <option>Canario</option>
            <option>Exótico</option>
          </select>
          <br />
          <br />
          <label for="foto" data-i18n="form_subir_foto">Suba una foto de su mascota</label>
          <br />
          <input type="file" name="foto" id="foto" accept="image/*" />
          <br />
          <br />
          <p style="margin: 0px auto" data-i18n="form_motivo_turno">Motivo del Turno:</p>
          <label for="motivoTurno0"></label>
          <input
            id="motivoTurno0"
            type="radio"
            name="motivoTurno"
            value="general"
            checked
          /> <span data-i18n="motivo_general">Chequeo General</span>
          <label for="motivoTurno1"></label>
          <input
            id="motivoTurno1"
            type="radio"
            name="motivoTurno"
            value="vacuna"
          /> <span data-i18n="motivo_vacunas">Vacunas</span>
          <label for="motivoTurno2"></label>
          <input
            id="motivoTurno2"
            type="radio"
            name="motivoTurno"
            value="cirugia"
          /> <span data-i18n="motivo_cirugia">Revisión por Cirugía</span>
          <label for="motivoTurno3"></label>
          <input
            id="motivoTurno3"
            type="radio"
            name="motivoTurno"
            value="otros"
          /> <span data-i18n="motivo_otros">Otros</span>
          <br />
          <label for="dia" data-i18n="form_dia">Día del turno</label>
          <input type="date" name="dia" id="dia" required />
          <br />
          <br />
          <label for="horario" data-i18n="form_horario">Horario</label>
          <input type="time" name="horario" id="horario" required />
          <br />
          <br />
          <button id="btnEnviarTurnos" type="button" data-i18n="form_enviar">Enviar</button>
          <input type="reset" value="Borrar" data-i18n="form_borrar" />
        </fieldset>
        <br />
        <br />
      </form>
      <!-- Formulario contacto  -->
      <form action="/formulario.php" method="POST">
        <fieldset class="FormularioFieldset">
          <legend><h2 data-i18n="contacto_title">Contactenos</h2></legend>
          <label for="nombreCompleto" data-i18n="contacto_nombre">Nombre y Apellido</label>
          <input
            type="text"
            id="nombreCompleto"
            name="nombreCompleto"
            required
          />
          <br />
          <br />
          <label for="email" data-i18n="contacto_mail">Mail</label>
          <input type="email" id="email" name="email" required />
          <br />
          <br />
          <label for="motivo" data-i18n="contacto_asunto">Asunto</label>
          <input type="text" id="motivo" name="motivo" required />
          <br />
          <br />
          <label for="comentario" data-i18n="contacto_consulta">Consulta</label>
          <textarea
            name="comentario"
            id="comentario"
            placeholder="Escriba su comentario..."
            required
          ></textarea>
          <br />
          <br />
          <button id="btnEnviarConsulta" type="button" data-i18n="contacto_enviar">Enviar</button>
        </fieldset>
      </form>
