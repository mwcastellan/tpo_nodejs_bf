                </li>
                <li class="nav-item">
                  <a class="nav-link" href="formulario.html" style="font-size: 16px; color: black" data-i18n="nav_contacto">Contacto</a>

          </div>
        </nav>
      </div>
    </header>

    <main>
      <h2 id="cliente_email">Cliente: -</h2>
      <!-- acciones -->
      <a id="btnAgregarPedido" href="#" class="pedidos_myButton" data-i18n="add_order">Agregar Pedido</a>
      <a
        href="login.html#"
        target="_blank"
        rel="noopener noreferrer"
        class="pedidos_myButton"
        data-i18n="login_client"
        >Login Cliente</a
      >
      <a
        href="clientes.html#"
        target="_blank"
        rel="noopener noreferrer"
        class="pedidos_myButton"
        data-i18n="register_client"
        >Registrar Cliente</a
      >
      <table id="pedidos">
        <caption data-i18n="orders_list">Lista de pedidos</caption>
        <thead>
          <tr>
            <th scope="col" data-i18n="th_id">ID</th>
            <th scope="col" data-i18n="th_fecha_compra">FECHA_COMPRA</th>
            <th scope="col" data-i18n="th_idcliente">IDCLIENTE</th>
            <th scope="col" data-i18n="th_idproducto">IDPRODUCTO</th>
            <th scope="col" data-i18n="th_precio">PRECIO</th>
            <th scope="col" data-i18n="th_cantidad">CANTIDAD</th>
            <th scope="col" data-i18n="th_importe">IMPORTE</th>
            <th scope="col" data-i18n="th_estado">ESTADO</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <!-- Modal -->
      <div id="pedidos_modal" class="pedidos_modale" aria-hidden="true">
        <div class="pedidos_modal-dialog">
          <div class="pedidos_modal-header">
            <h2>Datos del Pedido</h2>
            <button id="btnCloseModal" type="button" class="pedidos_btn-close pedidos_closemodale" aria-hidden="true">&times;</button>
          </div>

          <div class="pedidos_modal-body">
            <div>
            <label for="txtid">ID</label>
              <input
                id="txtid"
                type="number"
                placeholder="id"
                size="20"
                readonly
              />
            </div>
            <div>
              <label for="txtfecha_compra">FECHA_COMPRA</label>
              <input
                id="txtfecha_compra"
                type="date"
                placeholder="fecha_compra"
                size="20"
              />
            </div>
            <div>
              <label for="txtidcliente" data-i18n="label_idcliente">IDCLIENTE</label>
              <input
                id="txtidcliente"
                type="number"
                placeholder="idcliente"
                size="20"
                readonly
              />
            </div>
            <div>
              <label for="txtidproducto" data-i18n="label_idproducto">IDPRODUCTO</label>
              <input
                id="txtidproducto"
                type="number"
                placeholder="idproducto"
                size="20"
              />
            </div>
            <div>
              <label for="txtprecio" data-i18n="label_precio">PRECIO</label>
              <input
                id="txtprecio"
                type="number"
                placeholder="precio"
                size="20"
              />
            </div>
            <div>
              <label for="txtcantidad" data-i18n="label_cantidad">CANTIDAD</label>
              <input
                id="txtcantidad"
                type="number"
                placeholder="cantidad"
                size="20"
              />
            </div>
            <div>
              <label for="txtimporte" data-i18n="label_importe">IMPORTE</label>
              <input
                id="txtimporte"
                type="number"
                placeholder="importe"
                size="20"
              />
            </div>
            <div>
              <label for="txtidestado" data-i18n="label_estado">ESTADO</label>
              <input
                id="txtidestado"
                type="number"
                placeholder="idestado"
                size="20"
              />
              <div>
                <label for="txtmsg" data-i18n="label_mensaje">MENSAJE:</label>
                <div id="txtmsg"></div>
              </div>
            </div>
          </div>
          <div class="pedidos_modal-footer">
            <button id="btnSave" type="button" class="pedidos_btn" data-i18n="save">Guardar</button>
          </div>
        </div>
      </div>
      <!-- /Modal -->
    </main>

    <!-- Pie de pagina -->

        <a
          class="facebook"

    <script src="./js/i18n.js"></script>
